<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="countDonw.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Donw</title>
</head>
<body>
    <div class="container">
        <h1>Olympic Count Down</h1>
        <h2 id="result">
        </h2>
        </div>
   
</body>
<script>

    setInterval(()=>{
        const timeShow=document.querySelector(".container");
    const result=document.getElementById("result");
    const CurrentTime=Date.now();
    const OlympicTime= new Date(2028,6,14).getTime();
        const timeRemaining= OlympicTime-CurrentTime;
        const hours=Math.floor((timeRemaining)/(1000*60*60));
        const minutes=Math.floor((timeRemaining)/(1000*60));
        const days=Math.floor((timeRemaining)/(1000*60*60*24));
        const seconds=Math.floor((timeRemaining)/(1000));
        result.textContent=`${days}days ${hours}hours  ${minutes}minutes  ${seconds}seconds`
    },1000)

</script>
</html>
