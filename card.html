<!doctype html>
<html lang="en">
  <head>
    <!-- <link rel="stylesheet" href="card.css" /> -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
section{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction: column;
    background: black;
    color:white;
    height: 100vh;
    width:100%;

}
section::before{
    content: "";
    position: absolute;
    border-radius: 50%;
    height: 250px;
    width:250px;
   
    transform: translate(-150px, -100px);
    background: linear-gradient(90deg, rgb(255, 94, 231),rgb(209, 186, 205));

}
section::after{
    content: "";
    position:absolute;
    height: 250px;
    width:250px;
   
    border-radius: 50%;
    transform: translate(150px,100px);
    background: linear-gradient(90deg, rgb(255,94,231), rgb(209, 186, 205));
}
.card{
    position: relative;
    height: 250px;
    width:430px;
    box-shadow: 10px 10px 15px rgb(85, 63, 81);
    border-radius: 20px;
    border: 1px solid grey;
    backdrop-filter: blur(14px);
    z-index:1;
}
.card-front{
    padding: 20px;
}
/* .card .card-front .span{ */
.span{
    /* position: relative;
    height: 50px;
    width:50px;
    border-radius: 50%;
    background: #c7bf2d; */
    position: relative;
    height: 60px;
    width:110px;
}
.span::before{
    content:"";
position: absolute;
height:50px;
width:50px;
border-radius: 50%;
background:linear-gradient(90deg, #bbb657 , rgb(197, 99, 60)) ;
transform: translate(11px, 9px);

}
.span::after{
    content:"";
    position: absolute;
    height:50px;
    width:50px;
    border-radius: 50%;
    background:linear-gradient(90deg, rgb(212, 80, 31)) ;
    transform: translate(50px, 10px);
}
.title{
    display: flex;
    justify-content: end;
    position: relative;
    z-index: 2;
}
.title h1{
    margin: -46px 0px 10px 0px;
}
.sim{
    display:flex;
    /* justify-content:center;
    align-items: center; */
    flex-direction: row;
}

.sim img{
height: 60px;
width: 80px;
margin: 14px 0px 0px 15px;
border-radius: 10px;
}
 #rotate{
    height:50px;
    width:50px;
    margin: 1px;
    margin-top: 18px;
    transform: rotate(90deg);
    filter: brightness(0) invert(1);
}
.dueDate{
    display: flex;
    justify-content: center;
    align-items:center;
    flex-direction: row;
    gap:10px;
    z-index: 3;
}
 
.Number h4{
   
    margin: 10px 0px 0px 17px;
    letter-spacing: 2px;
}


.name h2{
    margin: 10px 0px 0px 17px;
}
.card .backside{
    display: flex;
    justify-content: center;
    flex-direction: row;
}
.backside span{
    display: flex;
    justify-content: center;
    margin: 5px;
}
.backside .black{
    display: flex;
    height: 40px;
    width:100%;


    
      background: repeating-linear-gradient(
        to bottom,
        black 0px,
        white 6px
      );
   
}
.signature{
    margin: 15px 0px 0px 25px;
}
.signature .line{
    height: 40px;
    width: 60%;
    background: rgb(182, 169, 169);
}
.para{
    margin: 30px 84px 0px 0px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
}

    </style>
  </head>
  <body>
    <section>
      <div class="contaier">
        <div class="front-card"></div>
      </div>
      <div class="card card-front">
        <div class="span">
          <span></span>
          <span></span>
        </div>
        <div class="title">
          <h1>Bank Alfalah</h1>
        </div>
        <div class="sim">
          <img src="chip.png" alt="" />
          <img id="rotate" src="wifi.png" alt="" />
        </div>
        <div class="dueDate">
          <h6>21/2020</h6>
          <h6>21/2050</h6>
        </div>
        <div class="Number">
          <h4>
            1234 &nbsp &nbsp &nbsp 5677 &nbsp &nbsp &nbsp 6785 &nbsp &nbsp &nbsp
            3423
          </h4>
        </div>
        <div class="name">
          <h2>Sohail Afridi</h2>
        </div>
      </div>
      <div class="card backside">
        <span>Customer service</span>
        <div class="black"></div>
        <div class="signature">
          <h5>AUTHORIZED SIGNATURE</h5>
          <div class="line">
            <h1 style="display: flex; justify-content: end">123</h1>

        <div class="para">

      </div>
    </section>
  </body>
</html>
